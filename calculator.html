<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сбер Кешбэк Калькулятор</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>

    <main class="container">
        <!-- Блок навигации -->
        <section class="navigation-panel card">
            <div class="sber-logo-placeholder">
                <span class="logo-circle"></span>
                <h1 class="nav-title">Сервисы</h1>
            </div>

            <div class="nav-links">
                <a href="info.html" class="btn-link nav-btn">О системе кешбэка</a>
                <a href="user.html" class="btn-link nav-btn">Профиль пользователя</a>
            </div>

            <div class="theme-switcher">
                <label for="theme-select">Оформление:</label>
                <select id="theme-select">
                    <option value="light">Светлая тема</option>
                    <option value="dark">Темная тема</option>
                </select>
            </div>
        </section>

        <!-- Калькулятор -->
        <section class="calculator-card card">
            <div id="result" class="display">0</div>

            <div class="keyboard">
                <button id="btn_op_clear" class="btn secondary">C</button>
                <button id="btn_op_sign" class="btn secondary">+/-</button>
                <button id="btn_op_percent" class="btn secondary">%</button>
                <button id="btn_op_div" class="btn primary">÷</button>

                <button id="btn_digit_7" class="btn digit">7</button>
                <button id="btn_digit_8" class="btn digit">8</button>
                <button id="btn_digit_9" class="btn digit">9</button>
                <button id="btn_op_mult" class="btn primary">×</button>

                <button id="btn_digit_4" class="btn digit">4</button>
                <button id="btn_digit_5" class="btn digit">5</button>
                <button id="btn_digit_6" class="btn digit">6</button>
                <button id="btn_op_minus" class="btn primary">−</button>

                <button id="btn_digit_1" class="btn digit">1</button>
                <button id="btn_digit_2" class="btn digit">2</button>
                <button id="btn_digit_3" class="btn digit">3</button>
                <button id="btn_op_plus" class="btn primary">+</button>

                <button id="btn_digit_0" class="btn digit zero">0</button>
                <button id="btn_digit_dot" class="btn digit">.</button>
                <button id="btn_op_equal" class="btn execute">=</button>
            </div>
        </section>
    </main>

</body>
</html>
