<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Кешбэка</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
</head>
<body>

    <main class="container">
        <section class="info-panel">
            <h1>Система учета кешбэка</h1>
            <p class="description">
                <strong>Услуги:</strong> категории с процентом кешбэка.<br>
                <strong>Заявки:</strong> ежемесячные сводки по клиентам с разбивкой трат и расчетом величины начислений.
            </p>

            <div class="controls">
                <a href="https://github.com/iu5git/JavaScript/tree/main/tutorials/lab1" class="btn-link" target="_blank">
                    GitHub репозиторий
                </a>

                <div class="theme-switcher">
                    <label for="theme-select">Тема оформления:</label>
                    <select id="theme-select">
                        <option value="light">Светлая тема</option>
                        <option value="dark">Темная тема</option>
                    </select>
                </div>

                <details class="author-info">
                    <summary>Информация об авторе</summary>
                    <p>Студент: Воробьев Е.А.<br>Группа: ИУ5-42Б<br>Вдохновлено дизайном Сбера</p>
                </details>
            </div>
        </section>

        <section class="calculator-card">
            <div id="result" class="display">0</div>

            <div class="keyboard">
                <button id="btn_op_clear" class="btn secondary">C</button>
                <button id="btn_op_sign" class="btn secondary">+/-</button>
                <button id="btn_op_percent" class="btn secondary">%</button>
                <button id="btn_op_div" class="btn primary">÷</button>

                <button id="btn_digit_7" class="btn digit">7</button>
                <button id="btn_digit_8" class="btn digit">8</button>
                <button id="btn_digit_9" class="btn digit">9</button>
                <button id="btn_op_mult" class="btn primary">×</button>

                <button id="btn_digit_4" class="btn digit">4</button>
                <button id="btn_digit_5" class="btn digit">5</button>
                <button id="btn_digit_6" class="btn digit">6</button>
                <button id="btn_op_minus" class="btn primary">−</button>

                <button id="btn_digit_1" class="btn digit">1</button>
                <button id="btn_digit_2" class="btn digit">2</button>
                <button id="btn_digit_3" class="btn digit">3</button>
                <button id="btn_op_plus" class="btn primary">+</button>

                <button id="btn_digit_0" class="btn digit zero">0</button>
                <button id="btn_digit_dot" class="btn digit">.</button>
                <button id="btn_op_equal" class="btn execute">=</button>
            </div>
        </section>
    </main>

</body>
</html>
